<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de Adopciones — Estadísticas</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<header class="site-header">
    <h1>Gestor de Adopciones</h1>
    <nav aria-label="Principal">
        <ul class="menu">
            <li><a href="./index.html">Portada</a></li>
            <li><a href="./agregar.html">Agregar aviso de adopción</a></li>
            <li><a href="./listado.html">Ver listado de adopciones</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2>Estadísticas</h2>

    <div class="charts">
        <!-- 1) Gráfico de líneas: avisos por día -->
        <figure class="card">
            <figcaption><strong>Avisos por día (últimos 7 días)</strong></figcaption>
            <!-- SVG accesible, sin scripts -->
            <svg class="chart" viewBox="0 0 640 320" role="img" aria-labelledby="t-linea d-linea">
                <title id="t-linea">Gráfico de líneas: avisos por día</title>
                <desc id="d-linea">Eje X: días; Eje Y: cantidad de avisos. Datos: Lu 2, Ma 3, Mi 4, Ju 3, Vi 5, Sá 4, Do 2.</desc>

                <!-- fondo -->
                <rect x="0" y="0" width="640" height="320" fill="#ffffff" />
                <!-- área de dibujo -->
                <g transform="translate(60,20)">
                    <!-- ejes -->
                    <line x1="0" y1="260" x2="560" y2="260" stroke="#e5e7eb" />
                    <line x1="0" y1="0"   x2="0"   y2="260" stroke="#e5e7eb" />
                    <!-- líneas guía -->
                    <g stroke="#f1f5f9">
                        <line x1="0" y1="208" x2="560" y2="208" />
                        <line x1="0" y1="156" x2="560" y2="156" />
                        <line x1="0" y1="104" x2="560" y2="104" />
                        <line x1="0" y1="52"  x2="560" y2="52"  />
                    </g>
                    <!-- etiquetas Y -->
                    <g fill="#6b7280" font-size="12" text-anchor="end">
                        <text x="-10" y="260">0</text>
                        <text x="-10" y="208">1</text>
                        <text x="-10" y="156">2</text>
                        <text x="-10" y="104">3</text>
                        <text x="-10" y="52">4</text>
                    </g>
                    <!-- polyline (datos escalados) -->
                    <!-- escala Y: 0..5 → 260..0 ; X: puntos equiespaciados -->
                    <polyline fill="none" stroke="#2563eb" stroke-width="2"
                        points="
                            0,208   93,156   186,104   279,156   372,52   465,104   558,208
                        " />
                    <!-- puntos -->
                    <g fill="#2563eb">
                        <circle r="4" cx="0" cy="208" />
                        <circle r="4" cx="93" cy="156" />
                        <circle r="4" cx="186" cy="104" />
                        <circle r="4" cx="279" cy="156" />
                        <circle r="4" cx="372" cy="52" />
                        <circle r="4" cx="465" cy="104" />
                        <circle r="4" cx="558" cy="208" />
                    </g>
                    <!-- etiquetas X -->
                    <g fill="#6b7280" font-size="12" text-anchor="middle">
                        <text x="0"   y="280">Lu</text>
                        <text x="93"  y="280">Ma</text>
                        <text x="186" y="280">Mi</text>
                        <text x="279" y="280">Ju</text>
                        <text x="372" y="280">Vi</text>
                        <text x="465" y="280">Sá</text>
                        <text x="558" y="280">Do</text>
                    </g>
                </g>
            </svg>
        </figure>

        <!-- 2) Gráfico de torta: total por tipo (gato/perro) -->
        <figure class="card">
            <figcaption><strong>Total de avisos por tipo</strong></figcaption>
            <svg class="chart" viewBox="0 0 640 320" role="img" aria-labelledby="t-torta d-torta">
                <title id="t-torta">Gráfico de torta: total por tipo</title>
                <desc id="d-torta">60% perros y 40% gatos, según datos ficticios.</desc>
                <rect x="0" y="0" width="640" height="320" fill="#ffffff" />
                <g transform="translate(320,160)">
                    <!-- círculo base (gatos 40%) -->
                    <circle r="100" fill="#f59e0b" />
                    <!-- porción perros 60%: arco superpuesto -->
                    <path d="
                        M 0 0
                        L 0 -100
                        A 100 100 0 1 1 -80 60
                        Z" fill="#2563eb" />
                    <!-- leyenda -->
                    <g transform="translate(130,-40)" font-size="14">
                        <rect x="0" y="0" width="16" height="16" fill="#2563eb" />
                        <text x="24" y="13" fill="#1f2937">Perros — 60%</text>
                        <rect x="0" y="28" width="16" height="16" fill="#f59e0b" />
                        <text x="24" y="41" fill="#1f2937">Gatos — 40%</text>
                    </g>
                </g>
            </svg>
        </figure>

        <!-- 3) Barras agrupadas por mes: Gatos vs Perros -->
        <figure class="card">
            <figcaption><strong>Avisos por mes (Gatos vs Perros)</strong></figcaption>
            <svg class="chart" viewBox="0 0 640 320" role="img" aria-labelledby="t-barras d-barras">
                <title id="t-barras">Gráfico de barras agrupadas</title>
                <desc id="d-barras">Meses Ene–Jun. Por mes se muestran dos barras: gatos y perros. Datos ficticios.</desc>
                <rect x="0" y="0" width="640" height="320" fill="#ffffff" />
                <g transform="translate(60,20)">
                    <!-- ejes -->
                    <line x1="0" y1="260" x2="560" y2="260" stroke="#e5e7eb" />
                    <line x1="0" y1="0"   x2="0"   y2="260" stroke="#e5e7eb" />
                    <!-- guías -->
                    <g stroke="#f1f5f9">
                        <line x1="0" y1="208" x2="560" y2="208" />
                        <line x1="0" y1="156" x2="560" y2="156" />
                        <line x1="0" y1="104" x2="560" y2="104" />
                        <line x1="0" y1="52"  x2="560" y2="52" />
                    </g>
                    <!-- etiquetas Y -->
                    <g fill="#6b7280" font-size="12" text-anchor="end">
                        <text x="-10" y="260">0</text>
                        <text x="-10" y="208">2</text>
                        <text x="-10" y="156">4</text>
                        <text x="-10" y="104">6</text>
                        <text x="-10" y="52">8</text>
                    </g>

                    <!-- barras (ancho grupo 80; separacion 14) -->
                    <!-- Datos por mes (Gatos/Perros): Ene 3/4, Feb 2/5, Mar 4/6, Abr 3/5, May 5/7, Jun 4/6 -->
                    <g>
                        <!-- Escala Y: valor*26 → 0..10 ≈ 0..260 -->
                        <!-- Ene -->
                        <rect x="0"   y="182" width="28" height="78" fill="#f59e0b"><title>Ene — Gatos: 3</title></rect>
                        <rect x="32"  y="156" width="28" height="104" fill="#2563eb"><title>Ene — Perros: 4</title></rect>
                        <!-- Feb -->
                        <rect x="94"  y="208" width="28" height="52" fill="#f59e0b"><title>Feb — Gatos: 2</title></rect>
                        <rect x="126" y="130" width="28" height="130" fill="#2563eb"><title>Feb — Perros: 5</title></rect>
                        <!-- Mar -->
                        <rect x="188" y="156" width="28" height="104" fill="#f59e0b"><title>Mar — Gatos: 4</title></rect>
                        <rect x="220" y="104" width="28" height="156" fill="#2563eb"><title>Mar — Perros: 6</title></rect>
                        <!-- Abr -->
                        <rect x="282" y="182" width="28" height="78" fill="#f59e0b"><title>Abr — Gatos: 3</title></rect>
                        <rect x="314" y="130" width="28" height="130" fill="#2563eb"><title>Abr — Perros: 5</title></rect>
                        <!-- May -->
                        <rect x="376" y="130" width="28" height="130" fill="#f59e0b"><title>May — Gatos: 5</title></rect>
                        <rect x="408" y="78"  width="28" height="182" fill="#2563eb"><title>May — Perros: 7</title></rect>
                        <!-- Jun -->
                        <rect x="470" y="156" width="28" height="104" fill="#f59e0b"><title>Jun — Gatos: 4</title></rect>
                        <rect x="502" y="104" width="28" height="156" fill="#2563eb"><title>Jun — Perros: 6</title></rect>
                    </g>

                    <!-- etiquetas X -->
                    <g fill="#6b7280" font-size="12" text-anchor="middle">
                        <text x="16"  y="280">Ene</text>
                        <text x="110" y="280">Feb</text>
                        <text x="204" y="280">Mar</text>
                        <text x="298" y="280">Abr</text>
                        <text x="392" y="280">May</text>
                        <text x="486" y="280">Jun</text>
                    </g>

                    <!-- leyenda -->
                    <g transform="translate(420,10)" font-size="14">
                        <rect x="0" y="0" width="16" height="16" fill="#2563eb" />
                        <text x="24" y="13" fill="#1f2937">Perros</text>
                        <rect x="0" y="28" width="16" height="16" fill="#f59e0b" />
                        <text x="24" y="41" fill="#1f2937">Gatos</text>
                    </g>
                </g>
            </svg>
        </figure>
    </div>

    <!-- Enlace requerido al final -->
    <p class="ver-mas">
        <a class="button-link" href="./index.html">Volver a la Portada</a>
    </p>
</main>

<footer class="site-footer">
    <p>CC5002 - Desarrollo de aplicaciones web - Allan Rabanales</p>
</footer>
</body>
</html>
